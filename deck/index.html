<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI Can Build It. Can You Trust It?</title>
<meta name="description" content="Interactive 20-minute demo: Vibe Coding vs. Engineered AI-SDLC, built around FlashFlip.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --paper:#05050A; --sheet:#0D0E17; --sheet2:#141626; --ink:#F3F4FF; --muted:#A3A7CC; --rule:#262A3F;
  --eng:#22D3EE; --eng-soft:#0E2A36; --vibe:#FF6B4A; --vibe-soft:#2A140F; --lime:#C8FF3D; --lime-ink:#0A0F02;
  --good:#4ADE80; --bad:#FF6B6B; --warn:#FFB454; --code:#04040A; --code-ink:#D9E6FF;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease-out:cubic-bezier(0.23,1,0.32,1);
  --ease-io:cubic-bezier(0.77,0,0.175,1);
  --glow:0 0 26px rgba(34,211,238,.38);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 clamp(15px,1.05vw + 10px,19px)/1.55 var(--f-body);overflow:hidden;
  background-image:radial-gradient(900px 520px at 12% -10%,rgba(34,211,238,.17),transparent 60%),radial-gradient(700px 500px at 100% 8%,rgba(200,255,61,.09),transparent 60%),radial-gradient(640px 420px at 50% 112%,rgba(255,107,74,.13),transparent 60%),linear-gradient(rgba(34,211,238,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(34,211,238,.06) 1px,transparent 1px);
  background-size:auto,auto,auto,34px 34px,34px 34px;background-attachment:fixed}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,rgba(255,255,255,.014) 0 1px,transparent 1px 3px)}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.08;text-wrap:balance;text-transform:uppercase;letter-spacing:-.01em}
h1{font-size:clamp(2rem,6.2vw,4.6rem);font-weight:800}
h2{font-size:clamp(1.35rem,3.2vw,2.3rem);font-weight:800}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
code,.mono{font-family:var(--f-mono);font-size:.86em}
code{background:rgba(34,211,238,.1);color:#9BEFFB;border:1px solid rgba(34,211,238,.18);padding:1px 6px;border-radius:4px;overflow-wrap:anywhere}
:focus-visible{outline:3px solid var(--eng);outline-offset:3px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.vibe{color:var(--vibe)} .eng{color:var(--eng)} .lime{color:var(--lime)}

/* ---------- app shell ---------- */
.app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;position:relative;z-index:1}
.top{display:flex;align-items:center;gap:12px;padding:10px max(16px,env(safe-area-inset-left)) 8px;background:rgba(13,14,23,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(34,211,238,.22);flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:.9rem;text-transform:uppercase;color:var(--eng);text-shadow:var(--glow);white-space:nowrap}
.seq{display:flex;gap:4px;flex:1;min-width:200px;overflow:hidden}
.seq span{font:600 .62rem/1 var(--f-mono);letter-spacing:.08em;padding:5px 7px;border-radius:4px;border:1px solid var(--rule);color:var(--muted);white-space:nowrap;transition:color .2s,border-color .2s,background-color .2s}
.seq span.on{color:var(--lime-ink);background:var(--lime);border-color:var(--lime);box-shadow:0 0 14px rgba(200,255,61,.4)}
.seq span.done{color:var(--eng);border-color:rgba(34,211,238,.4)}
.hud{display:flex;align-items:center;gap:10px}
.xp{font:700 .85rem var(--f-mono);color:var(--lime);font-variant-numeric:tabular-nums;white-space:nowrap}
.clock{font:600 1.15rem var(--f-mono);font-variant-numeric:tabular-nums;color:var(--eng);text-shadow:var(--glow);min-width:4.2ch;text-align:right}
.clock.warn{color:var(--vibe);text-shadow:0 0 18px rgba(255,107,74,.5)}
.btn{border:1px solid var(--rule);background:var(--sheet2);color:var(--ink);border-radius:999px;padding:8px 16px;font-weight:700;font-size:.85rem;transition:transform .16s var(--ease-out),border-color .2s,background-color .2s}
.btn:active{transform:scale(.97)}
@media (hover:hover) and (pointer:fine){.btn:hover{border-color:var(--eng)}}
.btn.go{background:linear-gradient(90deg,#22D3EE,#67E8F9);color:#04131A;border-color:transparent;box-shadow:var(--glow)}
.btn.hot{background:linear-gradient(90deg,#FF6B4A,#FF9A6B);color:#220A04;border-color:transparent;box-shadow:0 0 24px rgba(255,107,74,.4)}
.btn.lime{background:var(--lime);color:var(--lime-ink);border-color:transparent;box-shadow:0 0 20px rgba(200,255,61,.35)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.prog{height:3px;background:var(--rule)}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--eng),var(--lime));box-shadow:var(--glow);transition:width .5s var(--ease-out)}

.viewport{position:relative;overflow:hidden auto;scroll-behavior:smooth}
.stage{display:none;max-width:1120px;margin:0 auto;padding:clamp(16px,3.2vw,40px) max(16px,env(safe-area-inset-left)) 40px;gap:clamp(14px,2vw,24px);align-content:start}
.stage.on{display:grid}
.stage.on .rv{animation:rise .55s var(--ease-out) both;animation-delay:calc(var(--i,0)*60ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.eyebrow{font:600 .75rem var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--lime)}
.eyebrow::before{content:"// ";color:var(--eng)}
.lead{color:var(--muted);max-width:62ch;font-size:1.05em}
.say{font-size:1.08em;max-width:60ch}
.card{background:linear-gradient(180deg,rgba(255,255,255,.04),transparent),var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:clamp(14px,2.2vw,24px);position:relative;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 24px 50px -34px rgba(34,211,238,.4)}
.card::before{content:"";position:absolute;top:-1px;left:24px;right:24px;height:1px;background:linear-gradient(90deg,transparent,var(--eng),transparent);opacity:.7}
.chip{font:600 .66rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:4px;border:1px solid var(--rule);color:var(--muted);white-space:nowrap;display:inline-block}
.chip.live{background:var(--lime);color:var(--lime-ink);border-color:var(--lime);box-shadow:0 0 14px rgba(200,255,61,.45)}
.chip.v{background:var(--vibe-soft);color:var(--vibe);border-color:rgba(255,107,74,.4)}
.chip.e{background:var(--eng-soft);color:var(--eng);border-color:rgba(34,211,238,.4)}
.chip.g{background:#0F2A1A;color:var(--good);border-color:rgba(74,222,128,.4)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,2vw,22px)}
.cols.t3{grid-template-columns:repeat(3,minmax(0,1fr))}
.cols>*{min-width:0}

/* bottom nav */
.nav{display:flex;flex-wrap:wrap;align-items:center;gap:12px;row-gap:6px;padding:10px max(16px,env(safe-area-inset-left)) max(10px,env(safe-area-inset-bottom));background:rgba(13,14,23,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid rgba(34,211,238,.2)}
.dots{display:flex;gap:8px;flex:1;justify-content:center;flex-wrap:wrap}
.dots button{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--rule);background:var(--sheet);font:700 .72rem var(--f-mono);color:var(--muted);transition:transform .16s var(--ease-out),border-color .2s,background-color .2s}
.dots button.on{background:var(--eng);border-color:var(--eng);color:#04131A;box-shadow:var(--glow)}
.dots button.done{border-color:var(--lime);color:var(--lime)}
.dots button:active{transform:scale(.93)}
.credit{flex:0 0 100%;display:flex;justify-content:center;align-items:center;gap:4px 12px;flex-wrap:wrap;text-align:center;font:600 .68rem/1.2 var(--f-mono);letter-spacing:.06em;color:var(--muted)}
.credit b{color:var(--ink);font-weight:700}
.credit .heart{color:var(--vibe)}
.credit a{color:var(--eng);text-decoration:none;border-bottom:1px solid transparent;transition:border-color .15s ease}
@media (hover:hover) and (pointer:fine){.credit a:hover{border-bottom-color:var(--eng)}}

/* notes */
.notes{position:fixed;left:0;right:0;bottom:84px;z-index:20;transform:translateY(calc(100% + 80px));visibility:hidden;transition:transform .3s var(--ease-out),visibility 0s .3s;background:rgba(10,11,19,.96);border-top:2px solid var(--lime);padding:14px max(16px,env(safe-area-inset-left));backdrop-filter:blur(12px)}
.notes.on{transform:none;visibility:visible;transition:transform .3s var(--ease-out),visibility 0s}
.notes .in{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;font-size:.88rem}
.notes b{display:block;font:600 .66rem var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--lime);margin-bottom:3px}
.notes .planb b{color:var(--vibe)}

/* ---------- TITLE ---------- */
.title{min-height:calc(100dvh - 160px);align-content:center;text-align:left}
.title h1 .l{display:inline-block;opacity:0;transform:translateY(.5em);animation:rise .7s var(--ease-out) forwards;animation-delay:calc(var(--k)*28ms + 150ms)}
.grad{color:var(--eng);text-shadow:0 0 34px rgba(34,211,238,.5)}
.steplbl{display:none;font:700 .8rem var(--f-mono);color:var(--muted);flex:1;text-align:center}
.sub{font:600 clamp(.9rem,1.6vw,1.25rem) var(--f-mono);letter-spacing:.04em}
.race{width:100%;max-width:820px;margin-top:8px}
.race svg{width:100%;height:auto;overflow:visible}
.race .tr{fill:none;stroke:var(--rule);stroke-width:2}
.race .rv1,.race .rv2{fill:none;stroke-width:4;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
.stage.on .race .rv1{animation:draw 1.3s var(--ease-out) 1.1s forwards}
.stage.on .race .rv2{animation:draw 4.2s var(--ease-io) 1.1s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.race text{font:600 11px var(--f-mono);fill:var(--muted);letter-spacing:.06em}
.race .pop{opacity:0}
.stage.on .race .pop{animation:fade .4s ease-out forwards;animation-delay:var(--d)}
@keyframes fade{to{opacity:1}}
.race .q{font:800 34px var(--f-display);fill:var(--lime)}
.cta{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* ---------- HOOK ---------- */
.hook{grid-template-columns:1.15fr 1fr;align-items:start}
.hook>*{min-width:0}
.big60{font:800 clamp(2.6rem,9vw,6rem)/1 var(--f-display);color:var(--vibe);text-shadow:0 0 36px rgba(255,107,74,.45);font-variant-numeric:tabular-nums}
.phone{width:min(100%,300px);margin:0 auto;background:#000;border:2px solid #2b2f48;border-radius:34px;padding:14px;box-shadow:0 0 0 6px #0b0c14,0 30px 70px -24px rgba(255,107,74,.45)}
.phone .scr{background:#fafafa;color:#18181b;border-radius:22px;padding:16px;min-height:340px;display:grid;gap:10px;align-content:start;font-family:system-ui,sans-serif}
.phone h4{margin:0;font-size:1.1rem}
.phone .ta{background:#fff;border:1px solid #d4d4d8;border-radius:10px;padding:8px;font:.7rem/1.5 var(--f-mono);color:#27272a;min-height:84px;white-space:pre-wrap}
.phone .st{background:#18181b;color:#fff;border-radius:99px;text-align:center;padding:9px;font-size:.8rem;font-weight:600}
.fc{perspective:700px;height:120px;border:0;background:none;padding:0;width:100%}
.fc div{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s var(--ease-io)}
.fc.f div{transform:rotateY(180deg)}
.fc span{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:10px;border:1px solid #e4e4e7;border-radius:14px;background:#fff;backface-visibility:hidden;font-weight:700;font-size:.9rem}
.fc span+span{transform:rotateY(180deg);background:#f4f4f5;font-weight:500;font-size:.8rem}
.qrbox{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.qr{background:#fff;padding:10px;border-radius:10px;width:148px;height:148px;display:grid;place-items:center;color:#222;font:.7rem var(--f-mono);text-align:center}
.qr img,.qr canvas{width:100%!important;height:auto!important}
input.txt{width:100%;background:var(--code);border:1px solid var(--rule);color:var(--ink);border-radius:8px;padding:9px 12px;font:.82rem var(--f-mono)}
.poll{display:grid;gap:8px}
.poll .row{display:grid;grid-template-columns:150px 1fr 36px;gap:10px;align-items:center}
.poll button.opt{display:grid;grid-template-columns:150px 1fr 36px;gap:10px;align-items:center;background:none;border:0;text-align:left;padding:4px 0;width:100%}
.poll .lab{font-weight:600;font-size:.88rem}
.poll .tr{height:14px;border-radius:99px;background:var(--rule);overflow:hidden}
.poll .tr i{display:block;height:100%;width:0;transform-origin:left;border-radius:99px;transition:width .5s var(--ease-out);background:linear-gradient(90deg,var(--eng),var(--lime))}
.poll .n{font:700 .85rem var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}

/* ---------- BREAK ---------- */
.breakhead{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.ring{position:relative;width:84px;height:84px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7}
.ring .bg{stroke:var(--rule)} .ring .fg{stroke:var(--vibe);stroke-linecap:round;stroke-dasharray:264;stroke-dashoffset:0;transition:stroke-dashoffset 1s linear}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 1.1rem var(--f-mono);font-variant-numeric:tabular-nums}
.chal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;list-style:none;margin:0;padding:0}
.flip{perspective:1100px;min-height:236px}
.flip>.in{position:relative;height:100%;min-height:236px;transform-style:preserve-3d;transition:transform .6s var(--ease-io)}
.flip.f>.in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:14px;padding:16px;display:grid;gap:8px;align-content:start;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1.5px dashed var(--rule);background:var(--sheet);overflow:auto}
.face.back{transform:rotateY(180deg);border-style:solid}
.face.back.real{border-color:var(--vibe);background:linear-gradient(180deg,var(--vibe-soft),var(--sheet))}
.face.back.held{border-color:var(--good);background:linear-gradient(180deg,#0F2A1A,var(--sheet))}
.face.back.maybe{border-color:var(--warn);background:linear-gradient(180deg,#2E2210,var(--sheet))}
.face .t{font-weight:800;font-size:1.02em}
.face .try{font-size:.86rem;color:var(--muted)}
.face .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.lv{font:700 .62rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase}
.lv.e1{color:var(--good)} .lv.e2{color:var(--warn)} .lv.e3{color:var(--bad)}
.verdict{font:700 .7rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase}
.verdict.real{color:var(--vibe)} .verdict.held{color:var(--good)} .verdict.maybe{color:var(--warn)}
.fixl{font:600 .66rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--eng)}
.tst{font:.76rem var(--f-mono);color:var(--good)}
.badges{display:flex;gap:8px;flex-wrap:wrap}
.badge{display:flex;align-items:center;gap:6px;border:1px solid var(--rule);border-radius:99px;padding:5px 12px;font-size:.8rem;font-weight:700;color:var(--muted);transition:all .3s var(--ease-out)}
.badge.got{color:var(--lime-ink);background:var(--lime);border-color:var(--lime);box-shadow:0 0 16px rgba(200,255,61,.4)}
.toast{position:fixed;top:78px;right:16px;z-index:40;display:grid;gap:8px}
.toast div{background:var(--lime);color:var(--lime-ink);font-weight:800;padding:10px 16px;border-radius:10px;box-shadow:0 0 28px rgba(200,255,61,.5);animation:toast .4s var(--ease-out) both}
.toast div.out{opacity:0;transform:translateX(20px);transition:opacity .25s ease-out,transform .25s ease-out}
@keyframes toast{from{opacity:0;transform:translateX(24px) scale(.96)}to{opacity:1;transform:none}}

/* ---------- REVEAL ---------- */
.term{background:var(--code);border:1px solid rgba(34,211,238,.22);border-radius:12px;padding:14px 16px;font:.88rem/1.7 var(--f-mono);color:var(--code-ink);box-shadow:inset 0 0 40px rgba(34,211,238,.05);overflow-wrap:anywhere}
.term .wh{display:block;font:600 .64rem var(--f-mono);letter-spacing:.12em;color:#8FA7C4;text-transform:uppercase;margin-bottom:6px}
.term .cur{display:inline-block;width:.55em;height:1.1em;background:var(--vibe);vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.flowrow{display:flex;align-items:center;gap:0;flex-wrap:wrap}
.node{padding:10px 14px;border-radius:10px;border:1.5px solid var(--rule);background:var(--sheet);font:700 .78rem var(--f-mono);letter-spacing:.04em;text-transform:uppercase;opacity:.25;transform:scale(.96);transition:opacity .35s var(--ease-out),transform .35s var(--ease-out),border-color .35s,box-shadow .35s;text-align:center}
.node.on{opacity:1;transform:none}
.vf .node.on{border-color:var(--vibe);box-shadow:0 0 18px rgba(255,107,74,.3);color:var(--vibe)}
.ef .node.on{border-color:var(--eng);box-shadow:var(--glow);color:var(--eng)}
.ef .node{cursor:pointer}
.ef .node.sel{background:var(--eng-soft);outline:2px solid var(--lime)}
.arrow{width:26px;height:2px;background:var(--rule);position:relative;transition:background-color .3s}
.arrow.on{background:linear-gradient(90deg,var(--eng),var(--lime))}
.vf .arrow.on{background:var(--vibe)}
.stagebox{display:grid;gap:6px;font-size:.95rem}
.chart{width:100%;height:auto}
.chart .ax{stroke:var(--rule);stroke-width:1.5}
.chart text{font:600 11px var(--f-mono);fill:var(--muted)}
.chart .ln{fill:none;stroke-width:4;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
.chart.go .ln{animation:draw 2.2s var(--ease-io) forwards}
.chart.go .ln.b{animation-delay:.25s}
.chart .pt{opacity:0}.chart.go .pt{animation:fade .4s 1.9s forwards}
.vote{display:grid;gap:10px}
.vote .q{font-weight:700}
.vrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vbtn{position:relative;overflow:hidden;border-radius:10px;border:1.5px solid var(--rule);background:var(--sheet);padding:12px;text-align:left;font-weight:700;transition:transform .16s var(--ease-out),border-color .2s}
.vbtn:active{transform:scale(.97)}
.vbtn .bar{position:absolute;inset:0 auto 0 0;width:0;background:rgba(34,211,238,.16);transition:width .5s var(--ease-out);z-index:0}
.vbtn.v .bar{background:rgba(255,107,74,.2)}
.vbtn>span{position:relative;z-index:1;display:flex;justify-content:space-between;gap:8px}

/* ---------- TEAM ---------- */
.team{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;list-style:none;margin:0;padding:0;position:relative}
.team button{width:100%;height:100%;display:grid;gap:4px;justify-items:center;text-align:center;padding:14px 6px;border-radius:12px;border:1.5px dashed var(--rule);background:var(--sheet);transition:transform .2s var(--ease-out),border-color .2s,background-color .2s}
.team button .av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:1.4rem;background:var(--sheet2);border:1.5px solid var(--rule);transition:box-shadow .25s,border-color .25s}
.team button[aria-selected="true"]{border-style:solid;border-color:var(--eng);background:var(--eng-soft);box-shadow:var(--glow)}
.team button[aria-selected="true"] .av{border-color:var(--lime);box-shadow:0 0 18px rgba(200,255,61,.45)}
.team .nm{font:800 .78rem var(--f-display);text-transform:uppercase}
.team .rl{font-size:.72rem;color:var(--muted)}
.team .num{font:600 .62rem var(--f-mono);color:var(--eng)}
@media (hover:hover) and (pointer:fine){.team button:hover{transform:translateY(-3px);border-color:var(--eng)}}
.role{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.role .cell{background:var(--sheet2);border:1px solid var(--rule);border-radius:10px;padding:12px;display:grid;gap:4px;align-content:start;animation:rise .4s var(--ease-out) both;animation-delay:calc(var(--i)*45ms)}
.role .cell b{font:600 .64rem var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--lime)}
.role .cell.hum{border-color:rgba(255,107,74,.5)} .role .cell.hum b{color:var(--vibe)}
.arts{display:flex;gap:8px;flex-wrap:wrap}
.art{border:1px solid var(--eng);background:var(--eng-soft);color:var(--eng);border-radius:8px;padding:8px 12px;font:700 .8rem var(--f-mono);display:flex;gap:6px;align-items:center;transition:transform .16s var(--ease-out),box-shadow .2s}
.art:active{transform:scale(.97)}
@media (hover:hover) and (pointer:fine){.art:hover{box-shadow:var(--glow)}}
dialog{border:1px solid rgba(34,211,238,.4);background:var(--sheet);color:var(--ink);border-radius:16px;padding:0;width:min(760px,94vw);max-height:86dvh;box-shadow:0 0 80px rgba(34,211,238,.25)}
dialog::backdrop{background:rgba(2,2,6,.78);backdrop-filter:blur(4px)}
dialog[open]{animation:pop .28s var(--ease-out)}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
dialog .hd{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--rule)}
dialog pre{margin:0;padding:18px;overflow:auto;max-height:60dvh;font:.8rem/1.7 var(--f-mono);color:var(--code-ink);background:var(--code);white-space:pre-wrap;overflow-wrap:anywhere}
dialog .ft{padding:12px 18px;color:var(--muted);font-size:.88rem;border-top:1px solid var(--rule)}
.tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tool{background:var(--sheet2);border:1px solid var(--rule);border-radius:12px;padding:12px;display:grid;gap:4px;align-content:start;text-align:left;transition:transform .2s var(--ease-out),border-color .2s}
@media (hover:hover) and (pointer:fine){.tool:hover{transform:translateY(-2px);border-color:var(--eng)}}
.tool .tn{font-weight:800}
.tool .pe{color:var(--muted);font-size:.86rem}
.tool code{justify-self:start}
.po{display:grid;gap:10px}
.po .fb{min-height:3.2em;border-left:4px solid var(--lime);padding:8px 12px;background:var(--sheet2);border-radius:0 8px 8px 0;font-size:.92rem}

/* ---------- BUILD ---------- */
.agent{min-height:250px;max-height:340px;overflow:auto}
.agent .ln{display:block;opacity:0;transform:translateY(6px);animation:rise .35s var(--ease-out) forwards}
.agent .who{color:var(--eng)} .agent .me{color:var(--lime)} .agent .ok{color:var(--good)} .agent .ask{color:var(--warn)}
.tests{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.tests li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:9px 12px;border-radius:8px;background:var(--sheet2);border:1px solid var(--rule);font:.8rem var(--f-mono);transition:border-color .3s,background-color .3s}
.tests li .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.8rem;background:var(--rule);color:var(--muted);transition:background-color .3s,color .3s,transform .3s var(--ease-out)}
.tests li.pend .ic{animation:spin 1s linear infinite;background:transparent;border:2px solid var(--muted);border-top-color:var(--eng);color:transparent}
@keyframes spin{to{transform:rotate(360deg)}}
.tests li.red{border-color:var(--bad);background:#2E1212} .tests li.red .ic{background:var(--bad);color:#2a0606}
.tests li.grn{border-color:rgba(74,222,128,.45)} .tests li.grn .ic{background:var(--good);color:#04200f;transform:scale(1.08)}
.tests li .br{color:var(--muted);font-size:.72rem}
.sumline{font:700 1rem var(--f-mono);display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.sab{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.88rem;color:var(--muted)}
select{background:var(--code);color:var(--ink);border:1px solid var(--rule);border-radius:8px;padding:8px 10px;font:.82rem var(--f-mono)}

/* ---------- SHIP ---------- */
.pipe{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;position:relative;padding:20px 0 6px}
.pipe .st{display:grid;gap:6px;justify-items:center;text-align:center;position:relative;z-index:1}
.pipe .st .o{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:1.5rem;background:var(--sheet);border:2px solid var(--rule);transition:border-color .3s,box-shadow .3s,background-color .3s,transform .3s var(--ease-out)}
.pipe .st.run .o{border-color:var(--eng);box-shadow:var(--glow);transform:scale(1.08)}
.pipe .st.ok .o{border-color:var(--lime);background:#16200a;box-shadow:0 0 22px rgba(200,255,61,.4)}
.pipe .st b{font:700 .74rem var(--f-mono);text-transform:uppercase;letter-spacing:.05em}
.pipe .st span{font-size:.76rem;color:var(--muted);max-width:16ch}
.pipe .wire{position:absolute;left:10%;right:10%;top:51px;height:4px;background:var(--rule);border-radius:4px;z-index:0}
.pipe .wire i{display:block;height:100%;width:100%;transform:scaleX(0);transform-origin:left;background:linear-gradient(90deg,var(--eng),var(--lime));box-shadow:var(--glow);border-radius:4px;transition:transform 1s linear}
.log{font-size:.82rem;min-height:150px}
.log .ln{display:block;opacity:0;animation:rise .3s var(--ease-out) forwards}
.log .ok{color:var(--good)}

/* ---------- RETRY ---------- */
.rtry{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.rtry li{display:grid;grid-template-columns:1fr 150px 150px;gap:12px;align-items:center;padding:10px 14px;border:1px solid var(--rule);border-radius:10px;background:var(--sheet)}
.rtry .res{font:700 .76rem var(--f-mono);display:flex;gap:6px;align-items:center;padding:6px 10px;border-radius:8px;border:1px solid var(--rule);color:var(--muted);transition:color .3s,border-color .3s,background-color .3s,transform .3s var(--ease-out)}
.rtry .res.bad{color:var(--bad);border-color:rgba(255,107,106,.5);background:#2E1212}
.rtry .res.okk{color:var(--good);border-color:rgba(74,222,128,.5);background:#0F2A1A;transform:scale(1.03)}
.rtry .res.meh{color:var(--warn);border-color:rgba(255,180,84,.4);background:#2E2210}
.rtry .hd{font:600 .64rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.score{font:800 clamp(1.4rem,4vw,2.4rem) var(--f-display);color:var(--lime);text-shadow:0 0 24px rgba(200,255,61,.35);font-variant-numeric:tabular-nums}

/* ---------- FINALE ---------- */
.cmp{width:100%;border-collapse:collapse;font-size:.95rem}
.cmp th,.cmp td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
.cmp th{font:600 .7rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.cmp th.v,.cmp td.v{color:var(--vibe)} .cmp th.e,.cmp td.e{color:var(--eng)}
.cmp tr{opacity:0;transform:translateY(8px);transition:opacity .45s var(--ease-out),transform .45s var(--ease-out)}
.cmp tr.on{opacity:1;transform:none}
.cmp td:first-child{color:var(--ink);font-weight:600}
.tbl{overflow-x:auto}
.quote{font:800 clamp(1.3rem,3.6vw,2.2rem)/1.2 var(--f-display);text-transform:uppercase;color:var(--lime);max-width:26ch;text-shadow:0 0 30px rgba(200,255,61,.25)}
.quiz{display:grid;gap:10px}
.quiz .qq{font-weight:800}
.quiz .ans{display:grid;gap:8px}
.quiz .ans button{text-align:left;border:1.5px solid var(--rule);background:var(--sheet2);border-radius:10px;padding:10px 14px;transition:transform .16s var(--ease-out),border-color .2s,background-color .2s}
.quiz .ans button:active{transform:scale(.985)}
.quiz .ans button.right{border-color:var(--good);background:#0F2A1A}
.quiz .ans button.wrong{border-color:var(--bad);background:#2E1212}
.quiz .fb{font-size:.9rem;color:var(--muted);min-height:1.4em}
.outc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.outc div{background:var(--sheet2);border:1px solid var(--rule);border-radius:10px;padding:12px;font-size:.86rem;display:grid;gap:4px;align-content:start}
.outc b{font:800 .85rem var(--f-display);color:var(--eng)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}

/* ---------- BMAD OUTPUT ---------- */
.outg{display:grid;grid-template-columns:minmax(250px,.8fr) 1.5fr;gap:clamp(12px,2vw,22px);align-items:start}
.outg>*{min-width:0}
.tree{font:.78rem/1.85 var(--f-mono);list-style:none;margin:0;padding:0;display:grid}
.tree .d{color:var(--muted);padding-left:calc(var(--l)*14px)}
.tree .d::before{content:"▸ ";color:var(--eng)}
.tree .x{color:#6c7096;padding-left:calc(var(--l)*14px + 8px)}
.tree button.f{display:flex;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:1px 8px 1px calc(var(--l)*14px + 8px);color:var(--ink);font:inherit;transition:background-color .2s,box-shadow .2s}
.tree button.f::before{content:"📄"}
.tree button.f[aria-pressed="true"]{background:var(--eng-soft);box-shadow:inset 3px 0 0 var(--eng)}
@media (hover:hover) and (pointer:fine){.tree button.f:hover{background:rgba(34,211,238,.08)}}
.tree .tg{font-size:.58rem;letter-spacing:.06em;text-transform:uppercase;color:var(--lime);border:1px solid rgba(200,255,61,.4);border-radius:4px;padding:0 5px;margin-left:auto;white-space:nowrap}
.snap{border:1px solid rgba(34,211,238,.35);border-radius:12px;overflow:hidden;background:var(--code);position:relative;box-shadow:var(--glow)}
.snap .chrome{display:flex;gap:7px;align-items:center;padding:9px 12px;background:var(--sheet2);border-bottom:1px solid var(--rule);font:.7rem var(--f-mono);color:var(--muted)}
.snap .chrome i{width:10px;height:10px;border-radius:50%;background:#ff5f57;flex:none}
.snap .chrome i:nth-child(2){background:#febc2e}.snap .chrome i:nth-child(3){background:#28c840}
.snap .pth{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-left:6px}
.snap pre{margin:0;padding:14px 16px;font:.76rem/1.7 var(--f-mono);white-space:pre-wrap;overflow-wrap:anywhere;color:var(--code-ink);max-height:44dvh;overflow:auto}
.snap pre .h{color:var(--eng);font-weight:600}.snap pre .m{color:#6c7096}.snap pre .k{color:var(--lime)}
.snap .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.snap.shot .flash{animation:flash .5s ease-out}
.snap.shot pre{animation:rise .45s var(--ease-out)}
@keyframes flash{0%{opacity:.5}100%{opacity:0}}
.snap .cap{padding:10px 14px;border-top:1px solid var(--rule);font-size:.84rem;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stats div{background:var(--sheet2);border:1px solid var(--rule);border-radius:10px;padding:12px;display:grid;gap:2px}
.stats b{font:800 clamp(1.3rem,3vw,2rem) var(--f-display);color:var(--lime);font-variant-numeric:tabular-nums}
.stats span{font-size:.78rem;color:var(--muted)}

/* ---------- GIT ---------- */
.gloss{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.gloss div{background:var(--sheet2);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;font-size:.86rem;display:block}
.gloss b{display:block;margin-bottom:2px;font:700 .78rem var(--f-mono);color:var(--eng);text-transform:uppercase;letter-spacing:.06em}
.gitg{width:100%;height:auto;overflow:visible}
.gitg .lane{stroke:var(--rule);stroke-width:1;stroke-dasharray:3 7}
.gitg .edge{fill:none;stroke-width:3.5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
.gitg.go .edge{animation:draw .9s var(--ease-out) forwards;animation-delay:var(--d)}
.gitg .cm{cursor:pointer;opacity:0}
.gitg.go .cm{animation:fade .4s ease-out forwards;animation-delay:var(--d)}
.gitg .cm circle{fill:var(--sheet);stroke-width:3.5;transition:stroke .2s}
.gitg .cm.sel circle{stroke:var(--lime)!important;fill:#16200a}
.gitg .lc{opacity:0;transition:opacity .4s var(--ease-out);pointer-events:none}
.gitg .lc.show{opacity:1;pointer-events:auto;cursor:pointer}
.gitg .lc .edge{stroke-dashoffset:0;stroke-dasharray:6 6}
.gitg text{font:600 10.5px var(--f-mono);fill:var(--muted)}
.gitg .tg{fill:var(--lime)} .gitg .br{fill:var(--eng)}
.gitg #mainPtr{transition:transform .8s var(--ease-io)}
.gitg #mainPtr rect{fill:var(--lime)}.gitg #mainPtr text{fill:var(--lime-ink);font-weight:800;text-anchor:middle}
.prod{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font:600 .82rem var(--f-mono)}
.prod b{color:var(--lime)}
.cinfo{min-height:3.6em;border-left:4px solid var(--eng);background:var(--sheet2);border-radius:0 8px 8px 0;padding:8px 12px;font-size:.9rem}
.cinfo .mono{color:var(--eng)}
.f4{display:flex;align-items:flex-start;padding:6px 0}
.f4 .nd{display:grid;gap:6px;justify-items:center;text-align:center;flex:none;width:92px}
.f4 .nd .o{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:1.45rem;background:var(--sheet);border:2px solid var(--rule);transition:border-color .3s,box-shadow .3s,background-color .3s,transform .3s var(--ease-out)}
.f4 .nd.run .o{border-color:var(--eng);box-shadow:var(--glow);transform:scale(1.08)}
.f4 .nd.ok .o{border-color:var(--lime);background:#16200a;box-shadow:0 0 20px rgba(200,255,61,.4)}
.f4 .nd b{font:700 .7rem var(--f-mono);text-transform:uppercase;letter-spacing:.04em}
.f4 .nd span{font-size:.72rem;color:var(--muted)}
.f4 .wr{position:relative;flex:1;height:4px;margin-top:27px;background:var(--rule);border-radius:4px;min-width:20px}
.f4 .wr .pk{position:absolute;top:50%;left:0;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:var(--lime);box-shadow:0 0 14px var(--lime);opacity:0}
.ghb{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.ghb span{font:600 .6rem var(--f-mono);border:1px solid var(--rule);border-radius:4px;padding:1px 5px;color:var(--muted);transition:color .3s,border-color .3s,background-color .3s}
.ghb span.upd{color:var(--lime-ink);background:var(--lime);border-color:var(--lime)}
.crow{display:grid;grid-template-columns:26px 1fr;gap:10px;padding:10px 12px;border:1px solid var(--rule);border-radius:10px;background:var(--sheet);transition:border-color .3s,background-color .3s}
.crow .ix{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:700 .72rem var(--f-mono);background:var(--rule);color:var(--muted)}
.crow.cur{border-color:var(--eng);background:var(--eng-soft)}
.crow.cur .ix{background:var(--eng);color:#04131A}
.crow.done .ix{background:var(--lime);color:var(--lime-ink)}
.crow .cd{display:flex;gap:8px;align-items:center;justify-content:space-between}
.crow .cd code{flex:1;min-width:0}
.crow .pe{font-size:.82rem;color:var(--muted);margin-top:3px}
.crows{display:grid;gap:8px}
.cp{border:1px solid rgba(220,231,244,.3);background:transparent;border-radius:5px;font-size:.7rem;padding:2px 8px;color:var(--code-ink);flex:none}
@media (max-width:860px){
  .outg,.gloss,.stats{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}
  .f4 .nd{width:64px}.f4 .nd span{display:none}.f4 .nd .o{width:46px;height:46px}.f4 .wr{margin-top:21px}
}

@media (max-width:860px){
  .hook,.cols,.role,.tools,.cols.t3,.chal,.outc,.notes .in{grid-template-columns:1fr}
  .team{grid-template-columns:repeat(3,minmax(0,1fr))}
  .rtry li{grid-template-columns:1fr 1fr}.rtry li>:first-child{grid-column:1/-1}
  .pipe .st span{display:none}
  .seq,.dots{display:none}.steplbl{display:block}
  .poll .row,.poll button.opt{grid-template-columns:110px 1fr 30px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  .stage.on .rv{animation:fade .25s ease both!important}
  .flip>.in,.fc div{transition:none!important}
}

<body>
<div class="app">
  <header class="top" role="banner">
    <span class="brand">AI ⟶ Trust</span>
    <nav class="seq" id="seq" aria-label="Learning sequence"></nav>
    <div class="hud">
      <span class="xp" id="xp" aria-live="polite">0 XP</span>
      <span class="clock" id="clock" title="Presenter clock">20:00</span>
      <button class="btn go" id="clkBtn" type="button">Start</button>
      <button class="btn" id="notesBtn" type="button" aria-pressed="false" title="Presenter notes (P)">Notes</button>
    </div>
  </header>
  <div class="prog" aria-hidden="true"><i id="prog"></i></div>

  <main class="viewport" id="vp" tabindex="-1"><div id="stages"></div></main>

  <footer class="nav">
    <button class="btn" id="prev" type="button">← Back</button>
    <div class="dots" id="dots" role="tablist" aria-label="Steps"></div>
    <span class="steplbl" id="stepLbl" aria-hidden="true"></span>
    <button class="btn go" id="next" type="button">Next →</button>
    <div class="credit"><span>Made with <span class="heart" aria-label="love">&#10084;</span> by <b>Amer Radwan</b></span><a href="https://www.linkedin.com/in/amerradwan/" target="_blank" rel="noopener">LinkedIn &#8599;</a></div>
  </footer>
</div>

<aside class="notes" id="notes" aria-label="Presenter notes"><div class="in" id="notesIn"></div></aside>
<div class="toast" id="toast" aria-live="polite"></div>
<canvas id="confetti" aria-hidden="true"></canvas>
<dialog id="dlg" aria-labelledby="dlgT"><div class="hd"><h3 id="dlgT"></h3><button class="btn" id="dlgX" type="button">Close ✕</button></div><pre id="dlgB" tabindex="0"></pre><div class="ft" id="dlgF"></div></dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const sleep=ms=>new Promise(r=>setTimeout(r,RM?Math.min(ms,60):ms));

/* =============== DATA =============== */
const SEQ=['HOOK','PREDICT','EXPERIENCE','FAIL','DISCOVER','EXPLAIN','REBUILD','VERIFY','REFLECT'];
/* stage -> which SEQ indexes are active */
const STAGES=[
 {id:'title', nm:'Title',   at:null, seq:[],      say:'Hold on the title. Let the two lines race. Ask: "Two apps. Same AI. Same prompt budget. Which one would you trust?"', do:'Press Next when the race finishes.', plan:'If animation stutters on the projector, enable OS reduced motion; the page degrades gracefully.'},
 {id:'hook',  nm:'Hook',    at:0,    seq:[0,1],  say:'"AI built this application in 60 seconds. Scan the code, paste three terms from any course, flip through. Now: would you trust it for tomorrow\'s exam?" Take the vote BEFORE they break it.', do:'Paste your live Vercel link, show QR, tap the confidence poll as hands go up.', plan:'No Wi-Fi? Use the demo phone on the left and a hotspot. Do NOT reveal weaknesses yet.'},
 {id:'break', nm:'Break it',at:120,  seq:[2,3],  say:'"You are software detectives. 90 seconds. Pick a card, try the break on the app, then tell me: did it BREAK or HOLD?" Flip each card to reveal what the instructor verified.', do:'Start the 90 s timer. Click Broke/Held as students call out. Ask "why does it matter?" for the +100 bonus.', plan:'Cards were verified against this exact build with its real parser. Re-rehearse the day before: one-prompt results vary. Arabic display and very long text need a visual check on your device.'},
 {id:'reveal',nm:'Reveal',  at:240,  seq:[4],    say:'"Here is the one prompt I used. I accepted everything without reading. Great for a demo. Now look at what engineers do before any code exists."', do:'Run the vibe flow, then the engineered flow; click each stage for one sentence. Then take the two votes.', plan:'Fair-play line: vibe coding is not bad. It is untested confidence.'},
 {id:'team',  nm:'AI team', at:360,  seq:[5],    say:'"BMAD gives the AI a team of specialists. Same AI, different job each time. And at every stage a human still decides." Make students the Product Owner with the duplicate-policy choice.', do:'Click each specialist. Open artifacts. Let a student pick merge vs keep.', plan:'Agent names and commands depend on the installed BMAD version. Show your real installed ones in the terminal if asked.'},

 code:{n:'Source code',f:'app/lib/parse.ts',b:`// Story 3 (simplified)
export function parseCards(text: string) {
  const byTerm = new Map<string, Card>();
  const skipped: string[] = [];

  for (const raw of text.split(/\\r?\\n/)) {
    const line = raw.trim();
    if (!line) continue;

    const i = line.indexOf(" - ");        // first " - " only
    if (i < 1) { skipped.push(line); continue; }

    const term = line.slice(0, i).trim();
    const def  = line.slice(i + 3).trim();
    if (!def) { skipped.push(line); continue; }

    byTerm.set(term.toLowerCase(), { term, def }); // merge dupes
  }
  const all = [...byTerm.values()];
  return { cards: all.slice(0, 200), skipped, capped: all.length > 200 };
}`,why:'Simplified illustration of the engineered approach, not a byte-for-byte copy.'},

function confetti(){
  if(RM){return}
  const cols=['#22D3EE','#C8FF3D','#FF6B4A','#F3F4FF'];
  for(let i=0;i<150;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.6,vx:(Math.random()-.5)*16,vy:-Math.random()*17-4,s:4+Math.random()*6,c:cols[i%4],r:Math.random()*6,vr:(Math.random()-.5)*.4,l:1});
  if(!raf)raf=requestAnimationFrame(frame);
}
function frame(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;p.l-=.009;cx.save();cx.globalAlpha=Math.max(p.l,0);cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);cx.restore();});
  parts=parts.filter(p=>p.l>0&&p.y<cv.height+20);
  raf=parts.length?requestAnimationFrame(frame):0; if(!raf)cx.clearRect(0,0,cv.width,cv.height);
}

const stageEls=STAGES.map(s=>$('st-'+s.id));
const TOTAL=1200;let elapsed=0,running=false,tickId=0,startedAt=0,base=0;
const fmt=s=>{s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
function paintClock(){const left=TOTAL-elapsed;$('clock').textContent=fmt(left);$('clock').classList.toggle('warn',left<=300);$('prog').style.width=(elapsed/TOTAL*100)+'%';
  $('clkBtn').textContent=running?'Pause':(elapsed>0?'Resume':'Start');}
function tick(){elapsed=Math.min(TOTAL,base+(Date.now()-startedAt)/1000);if(elapsed>=TOTAL)clockPause();paintClock();}
function clockStart(){if(elapsed>=TOTAL)elapsed=0;running=true;base=elapsed;startedAt=Date.now();tickId=setInterval(tick,500);paintClock();}
function clockPause(){running=false;clearInterval(tickId);paintClock();}
$('clkBtn').onclick=()=>running?clockPause():clockStart();

let hooks={};
function go(i){
  i=Math.max(0,Math.min(maxStep,i));
  const st=STAGES[i];S.step=i;save();
  stageEls.forEach((el,j)=>{el.classList.toggle('on',j===i)});
  $('vp').scrollTop=0;
  dots.querySelectorAll('button').forEach((b,j)=>{b.classList.toggle('on',j===i);b.classList.toggle('done',j<i);b.setAttribute('aria-selected',j===i)});
  const act=new Set(st.seq),mx=st.seq.length?Math.max(...st.seq):-1;
  seqEl.querySelectorAll('span').forEach((el,j)=>{el.classList.toggle('on',act.has(j));el.classList.toggle('done',!act.has(j)&&j<mx)});
  $('prev').disabled=i===0;$('next').disabled=i===maxStep;$('stepLbl').textContent=(i+1)+' / '+STAGES.length+' · '+st.nm;
  $('notesIn').innerHTML=`<div><b>Say</b>${esc(st.say)}</div><div><b>Do</b>${esc(st.do)}</div><div class="planb"><b>If it goes wrong</b>${esc(st.plan)}</div>`;
  if(st.at!==null&&!running&&elapsed===0){/* clock starts manually */}
  if(hooks[st.id])hooks[st.id]();
  paintBadges();
}
$('prev').onclick=()=>go(S.step-1);$('next').onclick=()=>go(S.step+1);

addEventListener('keydown',e=>{
  if(e.target.closest('input,select,textarea,dialog'))return;
  if(e.metaKey||e.ctrlKey||e.altKey)return;

});

    </div></div></li>`}).join('');

  let pts=0,msg='';

 showvibe:{x:480,y:50,h:'764018a',m:'Trigger preview deployment',n:'Branch show-vibe sits on top of the vibe version. Pushing it makes Vercel build a preview.',col:'#FF6B4A',lab:['branch: show-vibe']},
 plan:{x:200,y:150,h:'1882f7a',m:'Planning: brief, PRD, architecture, stories',n:'The BMAD documents are committed first. The plan exists before the code does.',col:'#22D3EE',lab:[]},
 eng:{x:340,y:150,h:'00de100',m:'Stories 1-2: paste, flip, score, refresh',n:'Tag before-Live marks the starting line for the live build. origin/engineered points here.',col:'#22D3EE',lx:-14,lab:['tag: before-Live','branch: engineered']},
 s3a:{x:470,y:240,h:'2ac83e5',m:'Story 3: bulletproof paste (backup)',n:'Story 3, rehearsed in advance and saved as a backup.',col:'#C8FF3D',lab:[]},
 demo:{x:610,y:240,h:'c7c6d04',m:'Story 3: bulletproof paste (backup)',n:'Branch demo-done is the emergency switch. Push it to main if the live build overruns.',col:'#C8FF3D',lab:['branch: demo-done']},
 live:{x:540,y:150,h:'new',m:'Story 3: bulletproof paste',n:'The commit you make live in class. It lands on the engineered branch.',col:'#C8FF3D',lab:['made live today']}
};
const EDG=[['scaffold','vibe','#FF6B4A'],['vibe','showvibe','#FF6B4A'],['scaffold','plan','#22D3EE'],['plan','eng','#22D3EE'],['eng','s3a','#C8FF3D'],['s3a','demo','#C8FF3D']];
const PROD={vibe:'Vibe version · 8ba3c6b',eng:'Engineered, stories 1-2 · 00de100',live:'Engineered, story 3 made live today',demo:'Engineered, story 3 backup · c7c6d04'};
const pathD=(a,b)=>a.y===b.y?`M${a.x} ${a.y}H${b.x}`:`M${a.x} ${a.y}C${a.x+70} ${a.y} ${b.x-70} ${b.y} ${b.x} ${b.y}`;
let gMain='vibe',liveOn=false,gBuilt=false,gs=0,busy=false;
function buildGraph(){
  const L=GC.live;
  const lanes=[50,150,240].map(y=>`<path class="lane" d="M20 ${y}H740"/>`).join('');
  const edges=EDG.map((e,i)=>`<path class="edge" pathLength="1" stroke="${e[2]}" d="${pathD(GC[e[0]],GC[e[1]])}" style="--d:${(i*.35).toFixed(2)}s"/>`).join('');
  const lab=(c,k)=>c.lab.map((l,j)=>`<text class="${l.startsWith('tag')?'tg':'br'}" x="${c.x+(c.lx||0)}" y="${c.y+28+j*13}" text-anchor="${c.lx?'end':'middle'}">${esc(l)}</text>`).join('');
  const cms=Object.entries(GC).filter(([k])=>k!=='live').map(([k,c],i)=>`<g class="cm" data-c="${k}" tabindex="0" role="button" aria-label="${esc(c.h+' '+c.m)}" style="--d:${(i*.3+.2).toFixed(2)}s"><circle cx="${c.x}" cy="${c.y}" r="11" stroke="${c.col}"/><text x="${c.x}" y="${c.y-18}" text-anchor="middle">${c.h}</text>${lab(c,k)}</g>`).join('');
  const live=`<g class="lc" id="liveCm" data-c="live" role="button" tabindex="-1" aria-label="The live Story 3 commit"><path class="edge" stroke="#C8FF3D" d="${pathD(GC.eng,L)}"/><circle cx="${L.x}" cy="${L.y}" r="11" fill="#16200a" stroke="#C8FF3D" stroke-width="3.5" stroke-dasharray="4 3"/><text x="${L.x}" y="${L.y-18}" text-anchor="middle">new</text>${lab(L)}</g>`;
  const ptr=`<g id="mainPtr"><rect x="-44" y="-12" width="88" height="22" rx="6"/><text y="3" font-size="10">origin/main</text><path d="M-5 10L0 17L5 10Z" fill="#C8FF3D"/></g>`;
  $('gsvg').setAttribute('viewBox','0 -34 760 330');
  $('gsvg').innerHTML=lanes+edges+cms+live+ptr;
  setMain(gMain);$('liveCm').classList.toggle('show',liveOn);
}
function setMain(k){gMain=k;const c=GC[k];$('mainPtr').style.transform=`translate(${c.x}px,${c.y-52}px)`;$('prodNow').textContent=PROD[k];}
function addLive(on){liveOn=on;const l=$('liveCm');l.classList.toggle('show',on);l.tabIndex=on?0:-1}
function selectCommit(k){const c=GC[k];document.querySelectorAll('#gsvg [data-c]').forEach(g=>g.classList.toggle('sel',g.dataset.c===k));
  $('cinfo').innerHTML=`<span class="mono">${c.h}</span> · <b>${esc(c.m)}</b><br><span style="color:var(--muted)">${esc(c.n)}</span>`}
$('gsvg').addEventListener('click',e=>{const g=e.target.closest('[data-c]');if(g)selectCommit(g.dataset.c)});
$('gsvg').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const g=e.target.closest('[data-c]');if(g){e.preventDefault();e.stopPropagation();selectCommit(g.dataset.c)}}});
function playGraph(){const s=$('gsvg');s.classList.remove('go');void s.getBoundingClientRect();s.classList.add('go')}
$('gPlay').onclick=playGraph;

const FNODES=[['💻','Your laptop','local repo'],['🐙','GitHub','remote "origin"'],['▲','Vercel','builds main'],['📱','Phones','the live link']];
const GH=['main','engineered','demo-done','show-vibe'];
function paintGhb(u){$('ghb').innerHTML=GH.map(b=>`<span class="${u===b?'upd':''}">${b}</span>`).join('')}
function buildF4(){$('f4').innerHTML=FNODES.map((n,i)=>`<div class="nd" data-fn="${i}"><span class="o" aria-hidden="true">${n[0]}</span><b>${n[1]}</b><span>${n[2]}</span>${i===1?'<div class="ghb" id="ghb"></div>':''}</div>${i<3?`<div class="wr" data-wr="${i}"><i class="pk"></i></div>`:''}`).join('');paintGhb()}
const fnode=i=>document.querySelector(`[data-fn="${i}"]`);
function nstate(i,c){const n=fnode(i);n.classList.remove('run','ok');if(c)n.classList.add(c)}
const cap=t=>{$('fcap').innerHTML=t};
async function packet(i){const pk=document.querySelector(`[data-wr="${i}"] .pk`);
  if(RM){await sleep(60);return}
  pk.style.opacity=1;const a=pk.animate([{left:'0%'},{left:'calc(100% - 14px)'}],{duration:650,easing:'cubic-bezier(0.77,0,0.175,1)',fill:'forwards'});
  try{await a.finished}catch(e){}pk.style.opacity=0;a.cancel()}
async function ship(key,label){
  nstate(0,'ok');nstate(1,'run');nstate(2,'');nstate(3,'');
  await packet(0);nstate(1,'ok');paintGhb('main');setMain(key);
  cap('GitHub now has the new <b>main</b> and notifies Vercel that main changed (a webhook).');await sleep(600);
  await packet(1);nstate(2,'run');cap('Vercel is building the app …');await sleep(1100);nstate(2,'ok');
  await packet(2);nstate(3,'ok');cap('<b class="lime">Live.</b> '+label+' Students refresh the same link.');confetti();
}
const GCMD=[
 {c:'git checkout engineered',pe:'Switch to the engineered timeline.'},
 {c:'npm test',pe:'Run the automatic checks. No green, no release.'},
 {c:'npm run build',pe:'Build exactly what Vercel will build, so errors show up here first.'},
 {c:'git add . && git commit -m "Story 3: bulletproof paste"',pe:'Save the work as a commit, a named save point.'},
 {c:'git push origin engineered',pe:'Upload the commit to GitHub. Production is not touched yet.'},
 {c:'git push --force origin engineered:main',pe:'Make main equal to engineered. Vercel sees main change and ships it.'}
];
const GX=[['!','Emergency switch','git push --force origin demo-done:main','Deploy the rehearsed version if the live build overruns.'],['↺','Reset after rehearsal','git checkout engineered\ngit reset --hard before-Live\ngit push --force origin vibe:main','Engineered back to stories 1-2, live link back to the vibe version.']];
function paintCrows(){
  const row=(ix,c,pe,cls)=>`<div class="crow ${cls}"><span class="ix">${ix}</span><div><div class="cd"><code>${esc(c).replace(/\n/g,'<br>')}</code><button class="cp" type="button" data-cmd="${esc(c)}">Copy</button></div><div class="pe">${esc(pe)}</div></div></div>`;
  $('crows').innerHTML=GCMD.map((x,i)=>row(i<gs?'✓':i+1,x.c,x.pe,i<gs?'done':i===gs?'cur':'')).join('')+GX.map(x=>row(x[0],x[2],x[1]+': '+x[3],'')).join('');
}
async function runNext(){
  if(busy)return;if(gs>=GCMD.length){toast('Done. Press Reset to run it again.');return}
  busy=true;const i=gs;
  if(i<=2){nstate(0,'run');cap(['Switching timelines: you are now on <b>engineered</b>.','Running the tests on the laptop. Green means safe to continue.','Building the app the way Vercel will.'][i]);await sleep(900);nstate(0,'ok')}
  else if(i===3){nstate(0,'run');cap('A commit is a save point. A new <b>Story 3</b> commit appears on the engineered branch.');await sleep(500);addLive(true);selectCommit('live');await sleep(700);nstate(0,'ok')}
  else if(i===4){nstate(0,'ok');nstate(1,'run');await packet(0);nstate(1,'ok');paintGhb('engineered');cap('GitHub received <b>engineered</b>. Production (main) is unchanged, so students still see the old version.')}
  else if(i===5){await ship('live','The engineered Story 3 is now on main.')}
  gs++;paintCrows();busy=false;
}
$('gNext').onclick=runNext;
$('gAll').onclick=async()=>{if(busy)return;while(gs<GCMD.length){await runNext();await sleep(400)}};
$('gEmerg').onclick=async()=>{if(busy)return;busy=true;await ship('demo','The rehearsed demo-done backup is now on main.');busy=false};
$('gReset').onclick=()=>{busy=false;gs=0;addLive(false);setMain('vibe');buildF4();cap('Reset. Press <b>Run next</b> to start with the first command.');paintCrows();document.querySelectorAll('#gsvg .sel').forEach(g=>g.classList.remove('sel'));$('cinfo').innerHTML='<span style="color:var(--muted)">Click any commit.</span>'};
document.addEventListener('click',e=>{const b=e.target.closest('[data-cmd]');if(b)copy(b.dataset.cmd,b)});
hooks.git=()=>{if(!gBuilt){gBuilt=true;buildGraph();buildF4();paintCrows()}playGraph()};

/* =============== BOOT =============== */
renderXP();paintClock();paintPoll();
go(Math.min(S.step||0,maxStep));
if(window.QRCode===undefined){addEventListener('load',()=>{if(STAGES[S.step].id==='hook')drawQR(S.link)})}
})();
</script>
</body>
</html>
